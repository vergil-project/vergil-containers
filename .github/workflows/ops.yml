name: Ops

on:
  schedule:
    - cron: '37 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  packages: write
  security-events: write
  attestations: write
  id-token: write

jobs:
  # The pin exposure report was documented as "the internal-state observability
  # view for a daily morning-review ritual" but no workflow ever invoked it, so
  # nothing surfaced that trivy had sat a month behind a release carrying a CVE
  # fix while five unmerged bump PRs stacked up (#574).
  #
  # --no-probe skips the per-image Docker harvest: this job runs inside the
  # prod-base container with no Docker socket, and the drift signals need only
  # pins.yml, the templates, and one unmetered /releases/latest redirect per
  # tool.
  #
  # NO continue-on-error (#819): the report is informational, but the script
  # itself failing (an import error, a crash before it reports) must turn the
  # nightly red, or nobody learns the report has stopped working. A finding is
  # not a failure: report_exposure.py prints it and exits 0, and a flaky
  # upstream lookup is already downgraded to a ::warning:: inside the script.
  # docker/versions/test_ops_pin_exposure.py enforces it.
  pin-exposure:
    name: "pin exposure report"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ghcr.io/vergil-project/prod-base:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # bash with pipefail: under the container job's default `sh -e` the
      # pipeline's status is tee's, so a crash of the script would exit 0.
      - name: Report pin exposure
        working-directory: docker/pins
        shell: bash
        run: |
          set -euo pipefail
          uv run report_exposure.py --no-probe | tee -a "${GITHUB_STEP_SUMMARY}"

  # The language version lifecycle check (epic vergil-project/.github#407,
  # spec §6.2). Every family's adapter reads upstream release metadata; the
  # report covers every family on every run, and publish.py makes the open
  # `language-lifecycle` issues match it: one per change on a report-only
  # family, one per family whose check failed (closed on recovery). For the
  # `pr` families (python, go) `publish.py --prs` opens or refreshes one
  # add/drop PR per change instead. So no PR and no open issue reliably means
  # "in sync".
  #
  # NO continue-on-error, and unlike pin-exposure (which reports an
  # unresolvable upstream lookup as a warning and still passes), a check that
  # cannot reach or parse upstream (a Docker Hub or GitHub API rate limit
  # included) fails this job loudly, and still publishes its failure issue
  # first.
  # The add/drop branches and PRs, and the issues, are written with GitHub App
  # tokens, not this job's GITHUB_TOKEN, so it needs no contents, pull-requests
  # or issues write here. Each App token requests only what its steps call
  # (contents: write and pull-requests: write for the PR token, issues: write
  # for the issues token), never the installation's full grant. App-authored
  # PRs fire CI.
  #
  # Disabled until vergil-project/.github#1128 re-architects the publisher's
  # GitHub handling; that work re-enables this job. docker/versions/lifecycle/
  # stays in place meanwhile.
  language-lifecycle:
    name: "language lifecycle check"
    if: ${{ false }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: language-lifecycle
      cancel-in-progress: false
    container:
      image: ghcr.io/vergil-project/prod-base:latest
    env:
      OUT: lifecycle-out
    steps:
      # The App token authenticates the GitHub releases API reads (the LLVM
      # adapter), which unauthenticated get only 60 requests an hour per runner
      # IP, and the add/drop branch pushes and PRs. Minted here with
      # actions/create-github-app-token, scoped to this repository and to
      # exactly what this job calls: contents: write for the branch
      # pushes and the branch deletes on close, pull-requests: write to list,
      # open, refresh and close the PRs. The issues are written with the
      # separate issues token below. The public releases reads need no
      # permission.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Checked out with the App token so the add/drop branch pushes are
      # App-authored, and so trigger CI: a push made with GITHUB_TOKEN would
      # not.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # Exits 1 when any family's check failed, after writing both outputs. The
      # step fails with it (nothing masks the exit code), so the job is red;
      # the steps below still run on failure to summarise and publish it.
      - name: Run lifecycle check
        id: check
        shell: bash
        env:
          LIFECYCLE_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p "${OUT}"
          uv run docker/versions/lifecycle/check.py \
            --report "${OUT}/report.md" --json "${OUT}/results.json"

      - name: Job summary
        if: ${{ !cancelled() && hashFiles('lifecycle-out/report.md') != '' }}
        shell: bash
        run: cat "${OUT}/report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload report
        if: ${{ !cancelled() && hashFiles('lifecycle-out/results.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: language-lifecycle-report
          path: lifecycle-out/
          if-no-files-found: error

      # Every new lifecycle issue is linked under this repo's ad-hoc epic in
      # <owner>/.github (vergil-containers#687), and adding a sub-issue needs
      # issues: write on the epic's repository, which this job's GITHUB_TOKEN
      # can never have. So the issues are written with an App token scoped to
      # exactly this repository and the epic home, issues: write only, as
      # vergil-actions' ops-epic-rollup.yml mints for the same cross-repo link.
      - name: Generate app token for issues
        id: issues-token
        if: ${{ !cancelled() && hashFiles('lifecycle-out/results.json') != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            .github
          permission-issues: write

      - name: Open, refresh and close lifecycle issues
        if: ${{ !cancelled() && hashFiles('lifecycle-out/results.json') != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.issues-token.outputs.token }}
        run: |
          set -euo pipefail
          uv run docker/versions/lifecycle/publish.py \
            --results "${OUT}/results.json" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      # One PR per add/drop on a `pr` family, on lifecycle/<family>-<kind>-<v>,
      # rebuilt from this checkout as one commit and force-pushed only when it
      # changed; a rerun refreshes the same PR, never a second one. Nothing
      # auto-merges: a human reviews and merges every PR. Only from the
      # default branch: the checkout is the PRs' base.
      - name: Open, refresh and close add/drop PRs
        if: >-
          ${{ !cancelled() && hashFiles('lifecycle-out/results.json') != ''
          && github.ref_name == github.event.repository.default_branch }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          uv run docker/versions/lifecycle/publish.py --prs --base "${BASE}" \
            --results "${OUT}/results.json" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  github-config:
    uses: vergil-project/vergil-actions/.github/workflows/ops-github-config.yml@v2.1
    permissions:
      contents: read
      issues: write
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # The daily refresh of the upstream pins (#435, epic vergil-project/.github#649).
  # It runs vrg-upstream-refresh (epics vergil-project/.github#472 and #1168):
  # the [upstream-refresh].hook in vergil.toml (docker/pins/upstream-refresh.sh)
  # moves the binary-download tools' pins in docker/common/* and
  # docker/pins/workflow-images.txt and the toolchain pins in
  # docker/pins/toolchains.yml to their newest releases, and regenerates
  # docker/versions/matrix.json and docker/pins/CATALOG.md. The reusable
  # workflow runs the hook in a prepare job that holds no secrets, then a
  # publish job checks the patch against the path fence (the
  # [upstream-refresh].paths allowlist in vergil.toml), opens the PR on an
  # automation/upstream-refresh/<run-id> branch as the org automation App, and
  # merges it once CI passes. The run is red unless the PR merged or there was
  # nothing to change. The App token is minted inside the reusable workflow, so
  # this job's GITHUB_TOKEN needs only contents: read.
  upstream-refresh:
    uses: vergil-project/vergil-actions/.github/workflows/ops-upstream-refresh.yml@v2.1
    permissions:
      contents: read
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  nightly-rebuild-dev:
    uses: ./.github/workflows/cd-docker-publish.yml
    with:
      image-prefix: dev
      no-cache: true
      ref: develop
    permissions:
      packages: write
      contents: read
      security-events: write
      attestations: write
      id-token: write

  # The prod rebuild runs main's copy of the publish workflow, not this one's,
  # so the workflow logic and the checked-out tree always come from the same
  # ref. A schedule runs from the default branch (develop): calling
  # ./.github/workflows/... here would run develop's publish steps against
  # main's tree, and any step that needs a file added on develop since the last
  # release would fail with "No such file or directory" (issue #731). The
  # `ref: main` input is still required, because a reusable workflow's checkout
  # defaults to the caller's commit, which is develop's. Keep the inputs passed
  # here to ones main's cd-docker-publish.yml already accepts.
  nightly-rebuild-prod:
    uses: vergil-project/vergil-containers/.github/workflows/cd-docker-publish.yml@main
    with:
      image-prefix: prod
      no-cache: true
      ref: main
    permissions:
      packages: write
      contents: read
      security-events: write
      attestations: write
      id-token: write
