# https://github.com/vergil-project/vergil-actions/blob/develop/.github/workflows/README.md
name: CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  security-events: write
  attestations: write
  id-token: write
  pull-requests: write
  # Needed because the release job calls cd-release.yml@v2.1, whose CI-evidence
  # harvest downloads the release PR's artifacts; a reusable workflow cannot
  # request more permission than its caller grants.
  actions: read

jobs:
  docs:
    uses: vergil-project/vergil-actions/.github/workflows/cd-docs.yml@v2.1
    permissions:
      contents: write
    # The docs workflow reports its own failures as operations issues,
    # which needs the automation App's credentials. They live only in the
    # `automation` environment, whose secrets reach a reusable workflow in
    # another repo only under `secrets: inherit` (epic
    # vergil-project/.github#1384); a calling job cannot declare the
    # environment itself.
    secrets: inherit

  release:
    if: github.ref == 'refs/heads/main'
    uses: vergil-project/vergil-actions/.github/workflows/cd-release.yml@v2.1
    with:
      container-suffix: base
    # The release pushes its tag with the automation App's token, so
    # cd-release.yml needs the App's credentials, inherited from the
    # `automation` environment as for the docs job.
    secrets: inherit
    permissions:
      # This job-level block replaces the top-level permissions, so the
      # actions:read granted there does not carry over — cd-release.yml@v2.1's
      # CI-evidence harvest needs it, and the reusable-workflow graph is
      # validated at startup, so omitting it fails CD at load with
      # startup_failure even on develop where this job is skipped.
      actions: read
      contents: write
      pull-requests: write
      id-token: write
      attestations: write

  docker-publish:
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    uses: ./.github/workflows/cd-docker-publish.yml
    with:
      image-prefix: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    permissions:
      packages: write
      contents: read
      security-events: write
      attestations: write
      id-token: write

  # Report image-publish to the org's operations queue (epic
  # vergil-project/.github#1494): the ops-report action opens or comments on
  # the job's ops issue when it fails or is cancelled, and records the first
  # green run after one; it never closes an issue. It runs whatever
  # docker-publish did (always()), except on a release push: a push to main,
  # or a develop push whose head commit merges a release/* branch's PR (the
  # back-merge). The release records of epic vergil-project/.github#1440
  # already track and recover a release's failed CD jobs (spec §4.1). The
  # action reports only from refs/heads/develop, as the org automation App
  # with an issues-only token it mints, so this job's GITHUB_TOKEN only reads.
  # The App's keys live only in the `automation` environment, which this job
  # declares to read them (epic vergil-project/.github#1384).
  # A composite action cannot read `vars`, so the step delivers the trust
  # layer's inputs in its env. No concurrency group: one would cancel a
  # pending report. The docs job reports from inside cd-docs.yml.
  # docker/versions/test_ops_reporting.py pins this layout.
  report-image-publish:
    needs: [docker-publish]
    if: >-
      ${{ always() && github.ref != 'refs/heads/main'
      && !(startsWith(github.event.head_commit.message, 'Merge pull request #')
      && contains(github.event.head_commit.message, format(' from {0}/release/', github.repository_owner))) }}
    runs-on: ubuntu-24.04
    environment: automation
    permissions:
      contents: read
    steps:
      # Setting up Vergil inside the action reads this repo's vergil.toml.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Report to the operations queue
        uses: vergil-project/vergil-actions/actions/ops/report@v2.1
        env:
          VRG_TRUSTED_AUTHORS: ${{ vars.VRG_TRUSTED_AUTHORS }}
          VRG_AUTOMATION_APP: ${{ vars.VRG_AUTOMATION_APP }}
        with:
          job: image-publish
          results: ${{ needs.docker-publish.result }}
          app-client-id: ${{ secrets.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
