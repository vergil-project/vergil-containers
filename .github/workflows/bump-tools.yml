# Scheduled leading-edge bumper for the binary-download mechanism tools (#435).
#
# Weekly (and on demand) it calls vergil-actions' reusable ops-upstream-refresh
# workflow, which runs `vrg-upstream-refresh` (epic vergil-project/.github#472).
# That runs this repo's [upstream-refresh].hook (docker/pins/upstream-refresh.sh:
# resolve each tool's newest release, rewrite the `ARG *_VERSION=` pins in
# docker/common/*, regenerate docker/pins/CATALOG.md) and keeps exactly one PR
# on the fixed `upstream-refresh` branch in step with the result: opened when
# something drifted, refreshed in place on a later run, closed when nothing
# drifted any more. Nothing is auto-merged: fleet policy keeps a human merge
# gate.
#
# The push and PR are authored by the GitHub App (APP_CLIENT_ID/APP_PRIVATE_KEY),
# minted inside the reusable workflow. App-authored PRs DO fire `pull_request`
# workflows (unlike the default GITHUB_TOKEN, which GitHub recursion-suppresses),
# so CI validates every bump automatically. The pushes and PR writes go through
# that App token, so this job's GITHUB_TOKEN needs only contents: read.
name: Bump tools

on:
  schedule:
    # Mondays 06:30 UTC — after the nightly rebuild window, before the work week.
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-refresh:
    uses: vergil-project/vergil-actions/.github/workflows/ops-upstream-refresh.yml@v2.1
    permissions:
      contents: read
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
