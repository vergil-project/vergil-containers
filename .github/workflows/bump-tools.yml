# Scheduled leading-edge bumper for the 9 binary-download mechanism tools (#435).
#
# Weekly (and on demand) it resolves each tool's newest release via the
# /releases/latest redirect (docker/pins/resolve_latest.py), rewrites the
# `ARG *_VERSION=` pins in docker/common/*, regenerates docker/pins/CATALOG.md,
# and — only if something drifted — opens a reviewed bump PR. Nothing is
# auto-merged: fleet policy keeps a human merge gate.
#
# CAVEAT: this PR is authored with the default GITHUB_TOKEN, and GitHub does not
# fire `pull_request` workflows for token-authored PRs (loop-prevention). CI on
# the bump therefore needs one manual nudge — close/reopen the PR, or push an
# empty commit — until/unless this is switched to a GitHub App token. Documented
# here rather than hidden; see the #435 PR notes.
name: Bump tools

on:
  schedule:
    # Mondays 06:30 UTC — after the nightly rebuild window, before the work week.
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-tools
  cancel-in-progress: false

jobs:
  bump:
    name: "Resolve latest and open bump PR"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/vergil-project/prod-base:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Resolve latest versions and rewrite pins
        run: |
          python3 docker/pins/resolve_latest.py --write
          python3 docker/pins/generate_catalog.py

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No tool versions drifted; nothing to bump."
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            git --no-pager diff --stat
          fi

      - name: Open bump PR
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="bot/bump-tools-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add -A
          git commit -m "chore(deps): bump leading-edge binary tools to latest"
          git push origin "${branch}"
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${branch}" \
            --title "chore(deps): bump leading-edge binary tools to latest" \
            --body "Automated weekly leading-edge bump of the auto-managed binary tools (#435).

          Resolved via the \`/releases/latest\` redirect by \`docker/pins/resolve_latest.py\`.
          Versions stay pinned in source; a human reviews and merges (no auto-merge).

          \`\`\`
          $(git --no-pager show --stat --oneline HEAD | tail -n +2)
          \`\`\`

          NOTE: token-authored PRs do not auto-run CI — close/reopen or push an empty commit to trigger validation."
