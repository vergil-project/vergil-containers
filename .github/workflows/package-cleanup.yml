name: Package cleanup

# Two deleting jobs, both live: they delete for real unless a manual run asks
# for a preview. A third, `report`, deletes nothing: it reports the run's
# result to the org's operations queue.
#
# `cleanup` prunes the untagged version cruft the publish pipeline mints on
# every run (per-arch child manifests, provenance attestations, superseded
# :cache-* digests). Tagged versions — latest, the language-version tags, and
# the cache-* tags themselves — are never touched: untagged-only deletion
# leaves all live, referenceable images intact, and `validate` re-checks that
# every multi-arch tag still has its platform children afterward.
#
# `reap-aliases` enforces the sliding retention window on the immutable
# datestamp aliases the publish pipeline mints alongside each rolling tag
# ({prefix}-{lang}:{version}-YYYYMMDD, {prefix}-base:latest-YYYYMMDD). It
# deletes ONLY those `*-YYYYMMDD` aliases once they age past the window —
# prod = 30 days, dev = 7 days — so recent builds stay addressable for
# repoint rollback while old ones stop accumulating. Rolling tags (latest,
# 3.14, 1.26, 17, 21), build cache-* tags, and pre-promotion *-candidate tags
# never match its delete rule.
#
# Live by default (issue #912): the scheduled run always deletes for real. A
# manual run (workflow_dispatch) deletes too, unless the caller sets the
# `dry_run` input to true for a preview that only logs what would be deleted.
# No repository variable arms or disarms it; what runs is what git records.
#
# Token: the default GITHUB_TOKEN can list/preview. Real deletion of
# org-owned package versions may require a PAT with `delete:packages` stored
# as the secret GHCR_CLEANUP_TOKEN; the workflow prefers it when present.
# That token can write, so it lives only in the `automation` environment
# (epic vergil-project/.github#1384), and both deleting jobs declare the
# environment to read it, as `report` does for the automation App's keys. Only
# develop and main may deploy to the environment.
#
# Rate limits (issue #652): every leg fetches every manifest of its package
# from ghcr.io, and on a cold manifest cache that is ~25k registry GETs per
# run. With all 32 legs started at once, ghcr.io answered 429 and the action's
# own per-request retry (axios-retry, 3 tries, sub-second exponential backoff
# honouring Retry-After) ran out within seconds. Two workflow-level defences:
#   1. `max-parallel` caps how many legs of each job hit the registry at once
#      (3 per job; the jobs run one after the other, so at most 3 legs are in
#      flight instead of 32);
#   2. each leg retries the action ONCE after a bounded, jittered back-off
#      (RETRY_BACKOFF_BASE_SECONDS + up to RETRY_BACKOFF_JITTER_SECONDS), so a
#      transient 429 burst clears and the run completes. A second failure fails
#      the leg loudly with a rate-limit diagnosis — never a silent skip.
# The retry covers any failure of the action (a step's exit status cannot tell
# a 429 from other errors); re-running the cleanup is idempotent, so a retry of
# a non-transient failure costs one back-off and then fails the same way.
# Keep the attempt-1 and attempt-2 `with:` blocks identical —
# docker/versions/test_package_cleanup.py enforces it.
#
# Job ordering (issue #911): `reap-aliases` runs only after `cleanup` has
# finished, so the two never work on the same package at once. When they
# overlapped, a reap leg loaded a package's manifests while the cleanup leg
# was deleting that package's untagged versions, and failed with HTTP 404 on
# a manifest that had just gone. GitHub cannot make one matrix leg wait for
# the matching leg of another job, so the whole job waits. It also runs after
# a failed cleanup leg (`!cancelled()`): a reap does not depend on the prune
# succeeding, and skipping it would let the aliases pile up.
#
# The cold start itself is avoided by package-cache-warm.yml, which restores
# the action's manifest cache mid-week so GitHub's 7-day eviction never empties
# it (issue #700). It copies the action's cache scheme, so bump the action
# version in both files together.

on:
  schedule:
    - cron: "30 11 * * 0"  # Sundays 11:30 UTC, after the nightly ops run settles
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — log what would be deleted, delete nothing"
        type: boolean
        default: false

permissions:
  packages: write
  contents: read

# One run at a time, so two runs never delete at once: a reap leg of one run
# must not overlap a cleanup leg of the next (issue #911), and two runs in
# flight would double the legs on ghcr.io past the max-parallel cap (issue
# #652). The group stays at run level (issue #1010). On a matrix job a
# job-level group applies to each leg, so one group name would cancel all but
# two legs of every run, and a group per package would no longer cap the legs
# of two runs together.
#
# The trade-off with failure reporting: GitHub keeps one pending run per group
# and cancels an older pending one, before any of its jobs start, `report`
# included, so that cancel is never reported. The cancelled run had done
# nothing. The newer run that replaced it does the same work and reports only
# when it is a live run on develop, for the group is one for every ref and
# input. A dry-run dispatch that replaces a pending live run deletes nothing,
# so that week's deletions wait, unreported, for the next scheduled run. A
# dispatch from main deletes, but its result goes unreported: the report
# action reports only from refs/heads/develop. A dispatch from any other
# branch runs no job: the `automation` environment refuses it.
concurrency:
  group: package-cleanup
  cancel-in-progress: false

env:
  # Bounded back-off before the single retry of a failed cleanup attempt.
  RETRY_BACKOFF_BASE_SECONDS: 90
  RETRY_BACKOFF_JITTER_SECONDS: 60

jobs:
  cleanup:
    name: "cleanup: ${{ matrix.package }}"
    runs-on: ubuntu-24.04
    environment: automation
    strategy:
      fail-fast: false
      # Rate-limit cap (issue #652): keep in step with reap-aliases.
      max-parallel: 3
      matrix:
        package:
          # Generated from docker/versions/manifest.yml by docker/versions/generate.py.
          # BEGIN generated: versions (cleanup)
          - dev-base
          - dev-python
          - dev-go
          - dev-rust
          - dev-cpp-clang
          - dev-cpp-gcc
          - dev-ts-node
          - dev-pkg-ubuntu
          - dev-pkg-rhel
          - prod-base
          - prod-python
          - prod-go
          - prod-rust
          - prod-cpp-clang
          - prod-cpp-gcc
          - prod-ts-node
          - prod-pkg-ubuntu
          - prod-pkg-rhel
          # END generated: versions (cleanup)
    steps:
      - name: Prune untagged versions (attempt 1)
        id: attempt1
        # A failure here is retried once below after a back-off; the leg's
        # result is decided by attempt 2 (issue #652).
        continue-on-error: true
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: vergil-project
          packages: ${{ matrix.package }}
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
          delete-untagged: true
          # Same age floor as attempt 2 below (documented there).
          older-than: 24 hours
          validate: true
          # Same dry-run expression as attempt 2 below (documented there).
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

      - name: Back off before retrying
        if: steps.attempt1.outcome == 'failure'
        run: |
          delay=$(( RETRY_BACKOFF_BASE_SECONDS + RANDOM % (RETRY_BACKOFF_JITTER_SECONDS + 1) ))
          echo "::warning title=Package cleanup retry::Attempt 1 failed (often a ghcr.io 429 rate limit: 'Request failed with status code 429' above; a 'Request failed with status code 404' instead means a manifest was deleted while the action read it). Backing off ${delay}s, then retrying once."
          sleep "${delay}"

      - name: Prune untagged versions (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: vergil-project
          packages: ${{ matrix.package }}
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
          delete-untagged: true
          # The publish pipeline pushes each per-arch image by digest, untagged,
          # and only tags it (through the stitched multi-arch candidate) once
          # every build in its run has finished (vergil-containers#515). Until
          # then nothing references it, so pruning it would fail that publish.
          # Untagged versions younger than 24 hours are left for the next run;
          # the platform children of tagged images are never pruned anyway.
          older-than: 24 hours
          validate: true
          # Live unless a manual run asks for a preview (issue #912): only a
          # workflow_dispatch run with "Preview only" checked is a dry run. A
          # scheduled run has no inputs, so the expression is false and the
          # run deletes. No `|| ...` branch, so the Actions falsy-fall-through
          # pitfall (issue #388) cannot apply.
          #
          # Keep the expression on one line: a newline inside ${{ }} makes
          # GitHub reject the whole file at startup (startup_failure, issue
          # #449), and actionlint does not catch it.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

      - name: Report persistent failure
        if: failure() && steps.attempt2.outcome == 'failure'
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          echo "::error title=Package cleanup failed twice::ghcr-cleanup-action failed on both attempts for ${PACKAGE}, with a ${RETRY_BACKOFF_BASE_SECONDS}-$(( RETRY_BACKOFF_BASE_SECONDS + RETRY_BACKOFF_JITTER_SECONDS ))s back-off between them. If the attempt logs show 'Request failed with status code 429', ghcr.io is still rate limiting this token after the action's per-request retries (which honour Retry-After) and this workflow's retry: re-run the failed legs later, or lower max-parallel. If they show 'Request failed with status code 404', it is not a rate limit: a manifest was deleted while the action read it, so another deletion was working on the same package at the same time (as cleanup and reap-aliases once did, issue #911); check for an overlapping run before re-running. Any other error is not a rate limit either; read the attempt logs (issue #652)."
          exit 1

  reap-aliases:
    name: "reap: ${{ matrix.package }} (older than ${{ matrix.older_than }})"
    # Never overlap `cleanup` on the same package (issue #911; see the header).
    needs: cleanup
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    environment: automation
    strategy:
      fail-fast: false
      # Rate-limit cap (issue #652): keep in step with cleanup.
      max-parallel: 3
      matrix:
        # prod aliases live 30 days, dev aliases 7 (spec §9 capacity windows).
        include:
          # Generated from docker/versions/manifest.yml by docker/versions/generate.py.
          # BEGIN generated: versions (reap)
          - package: prod-base
            older_than: "30 days"
          - package: prod-python
            older_than: "30 days"
          - package: prod-go
            older_than: "30 days"
          - package: prod-rust
            older_than: "30 days"
          - package: prod-cpp-clang
            older_than: "30 days"
          - package: prod-cpp-gcc
            older_than: "30 days"
          - package: prod-ts-node
            older_than: "30 days"
          - package: prod-pkg-ubuntu
            older_than: "30 days"
          - package: prod-pkg-rhel
            older_than: "30 days"
          - package: dev-base
            older_than: "7 days"
          - package: dev-python
            older_than: "7 days"
          - package: dev-go
            older_than: "7 days"
          - package: dev-rust
            older_than: "7 days"
          - package: dev-cpp-clang
            older_than: "7 days"
          - package: dev-cpp-gcc
            older_than: "7 days"
          - package: dev-ts-node
            older_than: "7 days"
          - package: dev-pkg-ubuntu
            older_than: "7 days"
          - package: dev-pkg-rhel
            older_than: "7 days"
            # END generated: versions (reap)
    steps:
      - name: Reap datestamp aliases past the retention window (attempt 1)
        id: attempt1
        # A failure here is retried once below after a back-off; the leg's
        # result is decided by attempt 2 (issue #652).
        continue-on-error: true
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: vergil-project
          packages: ${{ matrix.package }}
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
          # Same inputs as attempt 2 below, where each one is documented.
          older-than: ${{ matrix.older_than }}
          use-regex: true
          delete-tags: '^.+-\d{8}$'
          validate: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

      - name: Back off before retrying
        if: steps.attempt1.outcome == 'failure'
        run: |
          delay=$(( RETRY_BACKOFF_BASE_SECONDS + RANDOM % (RETRY_BACKOFF_JITTER_SECONDS + 1) ))
          echo "::warning title=Package cleanup retry::Attempt 1 failed (often a ghcr.io 429 rate limit: 'Request failed with status code 429' above; a 'Request failed with status code 404' instead means a manifest was deleted while the action read it). Backing off ${delay}s, then retrying once."
          sleep "${delay}"

      - name: Reap datestamp aliases past the retention window (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: vergil-project
          packages: ${{ matrix.package }}
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
          # Only images older than the window are eligible; in-window aliases
          # (and every rolling tag) are left for repoint rollback.
          older-than: ${{ matrix.older_than }}
          use-regex: true
          # Delete ONLY immutable datestamp aliases: any tag ending in a dash
          # plus an 8-digit YYYYMMDD stamp — e.g. 3.14-20260716,
          # latest-20260716. Rolling tags (latest, 3.14, 1.26, 17, 21),
          # cache-* tags, and *-candidate tags carry no such suffix and never
          # match. Anchored so the datestamp is the whole trailing segment.
          #
          # This rule is the SOLE selector — precise enough that no exclude-tags
          # net is needed. Verified across every package: no rolling / version
          # / cache / candidate tag ends in -YYYYMMDD, so nothing else can match.
          # An earlier exclude-tags pattern was removed because the action's
          # ReDoS guard rejected its nested quantifier (\d+(\.\d+)*); the delete
          # rule's precision makes it moot (issue #453).
          delete-tags: '^.+-\d{8}$'
          # delete-untagged is left unset (defaults off because a delete rule
          # is present): untagged pruning is the `cleanup` job's remit, not
          # this one's.
          validate: true
          # Same dry-run expression as `cleanup` (documented there): live
          # unless a manual run checks "Preview only". Keep it on one line.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

      - name: Report persistent failure
        if: failure() && steps.attempt2.outcome == 'failure'
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          echo "::error title=Package cleanup failed twice::ghcr-cleanup-action failed on both attempts for ${PACKAGE}, with a ${RETRY_BACKOFF_BASE_SECONDS}-$(( RETRY_BACKOFF_BASE_SECONDS + RETRY_BACKOFF_JITTER_SECONDS ))s back-off between them. If the attempt logs show 'Request failed with status code 429', ghcr.io is still rate limiting this token after the action's per-request retries (which honour Retry-After) and this workflow's retry: re-run the failed legs later, or lower max-parallel. If they show 'Request failed with status code 404', it is not a rate limit: a manifest was deleted while the action read it, so another deletion was working on the same package at the same time (as cleanup and reap-aliases once did, issue #911); check for an overlapping run before re-running. Any other error is not a rate limit either; read the attempt logs (issue #652)."
          exit 1

  # Report package-cleanup, both its jobs as one result, to the org's
  # operations queue (epic vergil-project/.github#1494): any failed leg makes
  # it a failure, else any cancelled one a cancel. The ops-report action opens
  # or comments on the job's ops issue when it fails or is cancelled, and
  # records the first green run after one; it never closes an issue. It runs
  # whatever the jobs did (always()), and reports only from refs/heads/develop,
  # as the org automation App with an issues-only token it mints, so this
  # job's GITHUB_TOKEN only reads. The App's keys live only in the
  # `automation` environment, which the job declares to read them. A
  # composite action cannot read `vars`, so the step delivers the trust
  # layer's inputs in its env.
  # docker/versions/test_ops_reporting.py pins this layout.
  report:
    needs: [cleanup, reap-aliases]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    environment: automation
    permissions:
      contents: read
    steps:
      # Setting up Vergil inside the action reads this repo's vergil.toml.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Report to the operations queue
        uses: vergil-project/vergil-actions/actions/ops/report@v2.1
        env:
          VRG_TRUSTED_AUTHORS: ${{ vars.VRG_TRUSTED_AUTHORS }}
          VRG_AUTOMATION_APP: ${{ vars.VRG_AUTOMATION_APP }}
        with:
          job: package-cleanup
          results: ${{ needs.cleanup.result }},${{ needs.reap-aliases.result }}
          app-client-id: ${{ secrets.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
