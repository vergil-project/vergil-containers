name: Package cleanup

# Two jobs, one arming mechanism:
#
# `cleanup` prunes the untagged version cruft the publish pipeline mints on
# every run (per-arch child manifests, provenance attestations, superseded
# :cache-* digests). Tagged versions — latest, the language-version tags, and
# the cache-* tags themselves — are never touched: untagged-only deletion
# leaves all live, referenceable images intact, and `validate` re-checks that
# every multi-arch tag still has its platform children afterward.
#
# `reap-aliases` enforces the sliding retention window on the immutable
# datestamp aliases the publish pipeline mints alongside each rolling tag
# ({prefix}-{lang}:{version}-YYYYMMDD, {prefix}-base:latest-YYYYMMDD). It
# deletes ONLY those `*-YYYYMMDD` aliases once they age past the window —
# prod = 30 days, dev = 7 days — so recent builds stay addressable for
# repoint rollback while old ones stop accumulating. Rolling tags (latest,
# 3.14, 1.26, 17, 21), build cache-* tags, and pre-promotion *-candidate tags
# never match its delete rule.
#
# Ships in DRY-RUN by default. After reviewing a preview run's logs, arm real
# deletions by setting the repository variable PACKAGE_CLEANUP_DRY_RUN=false
# (Settings → Secrets and variables → Actions → Variables). No code change.
#
# Token: the default GITHUB_TOKEN can list/preview. Real deletion of
# org-owned package versions may require a PAT with `delete:packages` stored
# as the secret GHCR_CLEANUP_TOKEN; the workflow prefers it when present.
#
# Rate limits (issue #652): every leg fetches every manifest of its package
# from ghcr.io, and on a cold manifest cache that is ~25k registry GETs per
# run. With all 32 legs started at once, ghcr.io answered 429 and the action's
# own per-request retry (axios-retry, 3 tries, sub-second exponential backoff
# honouring Retry-After) ran out within seconds. Two workflow-level defences:
#   1. `max-parallel` caps how many legs of each job hit the registry at once
#      (3 per job, so at most 6 legs in flight instead of 32);
#   2. each leg retries the action ONCE after a bounded, jittered back-off
#      (RETRY_BACKOFF_BASE_SECONDS + up to RETRY_BACKOFF_JITTER_SECONDS), so a
#      transient 429 burst clears and the run completes. A second failure fails
#      the leg loudly with a rate-limit diagnosis — never a silent skip.
# The retry covers any failure of the action (a step's exit status cannot tell
# a 429 from other errors); re-running the cleanup is idempotent, so a retry of
# a non-transient failure costs one back-off and then fails the same way.
# Keep the attempt-1 and attempt-2 `with:` blocks identical —
# docker/versions/test_package_cleanup.py enforces it.

on:
  schedule:
    - cron: "30 11 * * 0"  # Sundays 11:30 UTC, after the nightly ops run settles
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — log what would be deleted, delete nothing"
        type: boolean
        default: true

permissions:
  packages: write
  contents: read

concurrency:
  group: package-cleanup
  cancel-in-progress: false

env:
  # Bounded back-off before the single retry of a failed cleanup attempt.
  RETRY_BACKOFF_BASE_SECONDS: 90
  RETRY_BACKOFF_JITTER_SECONDS: 60

jobs:
  cleanup:
    name: "cleanup: ${{ matrix.package }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Rate-limit cap (issue #652): keep in step with reap-aliases.
      max-parallel: 3
      matrix:
        package:
          # Generated from docker/versions/manifest.yml by docker/versions/generate.py.
          # BEGIN generated: versions (cleanup)
          - dev-base
          - dev-python
          - dev-java
          - dev-go
          - dev-rust
          - dev-cpp-clang
          - dev-cpp-gcc
          - dev-ts-node
          - prod-base
          - prod-python
          - prod-java
          - prod-go
          - prod-rust
          - prod-cpp-clang
          - prod-cpp-gcc
          - prod-ts-node
          # END generated: versions (cleanup)
    steps:
      - name: Prune untagged versions (attempt 1)
        id: attempt1
        # A failure here is retried once below after a back-off; the leg's
        # result is decided by attempt 2 (issue #652).
        continue-on-error: true
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: vergil-project
          packages: ${{ matrix.package }}
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
          delete-untagged: true
          validate: true
          # Same arming expression as attempt 2 below (documented there).
          dry-run: >-
            ${{ !(
            (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
            || (github.event_name == 'schedule' && vars.PACKAGE_CLEANUP_DRY_RUN == 'false')
            ) }}

      - name: Back off before retrying
        if: steps.attempt1.outcome == 'failure'
        run: |
          delay=$(( RETRY_BACKOFF_BASE_SECONDS + RANDOM % (RETRY_BACKOFF_JITTER_SECONDS + 1) ))
          echo "::warning title=Package cleanup retry::Attempt 1 failed (often a ghcr.io 429 rate limit: 'Request failed with status code 429' above). Backing off ${delay}s, then retrying once."
          sleep "${delay}"

      - name: Prune untagged versions (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: vergil-project
          packages: ${{ matrix.package }}
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
          delete-untagged: true
          validate: true
          # Real deletion is armed only when a trigger explicitly asks for it:
          # a manual run with "Preview only" unchecked, or a scheduled run with
          # the repo variable PACKAGE_CLEANUP_DRY_RUN set to 'false'. Everything
          # else (default) stays in preview. Written as !(armed) rather than
          # `cond && a || b` to avoid the Actions falsy-fall-through pitfall,
          # where an unchecked box (inputs.dry_run == false) would otherwise
          # fall through to the scheduled branch.
          #
          # Folded-scalar rule: every continuation line below MUST stay at the
          # SAME indentation as the `${{` line. A `>-` scalar preserves newlines
          # on more-indented lines, and a newline *inside* ${{ }} makes GitHub
          # reject the whole file at startup (startup_failure, issue #449) —
          # actionlint tokenizes expressions loosely and will not catch it.
          dry-run: >-
            ${{ !(
            (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
            || (github.event_name == 'schedule' && vars.PACKAGE_CLEANUP_DRY_RUN == 'false')
            ) }}

      - name: Report persistent failure
        if: failure() && steps.attempt2.outcome == 'failure'
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          echo "::error title=Package cleanup failed twice::ghcr-cleanup-action failed on both attempts for ${PACKAGE}, with a ${RETRY_BACKOFF_BASE_SECONDS}-$(( RETRY_BACKOFF_BASE_SECONDS + RETRY_BACKOFF_JITTER_SECONDS ))s back-off between them. If the attempt logs show 'Request failed with status code 429', ghcr.io is still rate limiting this token after the action's per-request retries (which honour Retry-After) and this workflow's retry: re-run the failed legs later, or lower max-parallel. Any other error is not a rate limit; read the attempt logs (issue #652)."
          exit 1

  reap-aliases:
    name: "reap: ${{ matrix.package }} (older than ${{ matrix.older_than }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Rate-limit cap (issue #652): keep in step with cleanup.
      max-parallel: 3
      matrix:
        # prod aliases live 30 days, dev aliases 7 (spec §9 capacity windows).
        include:
          # Generated from docker/versions/manifest.yml by docker/versions/generate.py.
          # BEGIN generated: versions (reap)
          - package: prod-base
            older_than: "30 days"
          - package: prod-python
            older_than: "30 days"
          - package: prod-java
            older_than: "30 days"
          - package: prod-go
            older_than: "30 days"
          - package: prod-rust
            older_than: "30 days"
          - package: prod-cpp-clang
            older_than: "30 days"
          - package: prod-cpp-gcc
            older_than: "30 days"
          - package: prod-ts-node
            older_than: "30 days"
          - package: dev-base
            older_than: "7 days"
          - package: dev-python
            older_than: "7 days"
          - package: dev-java
            older_than: "7 days"
          - package: dev-go
            older_than: "7 days"
          - package: dev-rust
            older_than: "7 days"
          - package: dev-cpp-clang
            older_than: "7 days"
          - package: dev-cpp-gcc
            older_than: "7 days"
          - package: dev-ts-node
            older_than: "7 days"
            # END generated: versions (reap)
    steps:
      - name: Reap datestamp aliases past the retention window (attempt 1)
        id: attempt1
        # A failure here is retried once below after a back-off; the leg's
        # result is decided by attempt 2 (issue #652).
        continue-on-error: true
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: vergil-project
          packages: ${{ matrix.package }}
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
          # Same inputs as attempt 2 below, where each one is documented.
          older-than: ${{ matrix.older_than }}
          use-regex: true
          delete-tags: '^.+-\d{8}$'
          validate: true
          dry-run: >-
            ${{ !(
            (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
            || (github.event_name == 'schedule' && vars.PACKAGE_CLEANUP_DRY_RUN == 'false')
            ) }}

      - name: Back off before retrying
        if: steps.attempt1.outcome == 'failure'
        run: |
          delay=$(( RETRY_BACKOFF_BASE_SECONDS + RANDOM % (RETRY_BACKOFF_JITTER_SECONDS + 1) ))
          echo "::warning title=Package cleanup retry::Attempt 1 failed (often a ghcr.io 429 rate limit: 'Request failed with status code 429' above). Backing off ${delay}s, then retrying once."
          sleep "${delay}"

      - name: Reap datestamp aliases past the retention window (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: vergil-project
          packages: ${{ matrix.package }}
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
          # Only images older than the window are eligible; in-window aliases
          # (and every rolling tag) are left for repoint rollback.
          older-than: ${{ matrix.older_than }}
          use-regex: true
          # Delete ONLY immutable datestamp aliases: any tag ending in a dash
          # plus an 8-digit YYYYMMDD stamp — e.g. 3.14-20260716,
          # latest-20260716. Rolling tags (latest, 3.14, 1.26, 17, 21),
          # cache-* tags, and *-candidate tags carry no such suffix and never
          # match. Anchored so the datestamp is the whole trailing segment.
          #
          # This rule is the SOLE selector — precise enough that no exclude-tags
          # net is needed. Verified across every package: no rolling / version
          # / cache / candidate tag ends in -YYYYMMDD, so nothing else can match.
          # An earlier exclude-tags pattern was removed because the action's
          # ReDoS guard rejected its nested quantifier (\d+(\.\d+)*); the delete
          # rule's precision plus the DRY-RUN-by-default arming make it moot
          # (issue #453).
          delete-tags: '^.+-\d{8}$'
          # delete-untagged is left unset (defaults off because a delete rule
          # is present): untagged pruning is the `cleanup` job's remit, not
          # this one's.
          validate: true
          # Same arming mechanism as `cleanup`: preview unless a manual run
          # explicitly unchecks "Preview only", or a scheduled run has the repo
          # variable PACKAGE_CLEANUP_DRY_RUN set to 'false'. !(armed) form
          # avoids the Actions falsy-fall-through pitfall.
          #
          # Folded-scalar rule (see `cleanup` above): keep every continuation
          # line at the SAME indentation as the `${{` line — a newline inside
          # ${{ }} is a startup_failure (issue #449).
          dry-run: >-
            ${{ !(
            (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
            || (github.event_name == 'schedule' && vars.PACKAGE_CLEANUP_DRY_RUN == 'false')
            ) }}

      - name: Report persistent failure
        if: failure() && steps.attempt2.outcome == 'failure'
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          echo "::error title=Package cleanup failed twice::ghcr-cleanup-action failed on both attempts for ${PACKAGE}, with a ${RETRY_BACKOFF_BASE_SECONDS}-$(( RETRY_BACKOFF_BASE_SECONDS + RETRY_BACKOFF_JITTER_SECONDS ))s back-off between them. If the attempt logs show 'Request failed with status code 429', ghcr.io is still rate limiting this token after the action's per-request retries (which honour Retry-After) and this workflow's retry: re-run the failed legs later, or lower max-parallel. Any other error is not a rate limit; read the attempt logs (issue #652)."
          exit 1
