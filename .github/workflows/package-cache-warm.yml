name: Package cache warm

# Keeps package-cleanup.yml's manifest cache from being evicted (issue #700).
#
# dataaxiom/ghcr-cleanup-action keeps a cross-run cache of the manifests it
# fetches, in the repo's Actions cache: one entry per package per run, keyed
# ghcr-manifest-v1-<owner>-<package>-<run id> and restored by the prefix
# ghcr-manifest-v1-<owner>-<package>-. GitHub evicts a cache entry that has not
# been accessed for 7 days, and the cleanup runs weekly at whatever time the
# scheduler starts it, so the gap is sometimes just over 7 days. The cleanup
# then starts cold and fetches every manifest from ghcr.io: the 2026-11-01 run
# started cold for every package and fetched 37,500 manifests (the 429 storm
# of issue #652).
#
# This workflow restores each package's newest cache entry mid-week. A restore
# counts as an access, so the entry stays well inside the 7-day window and the
# next cleanup starts warm. The restore is a download from the GitHub cache
# service and makes no ghcr.io requests. A second weekly cleanup run would
# also keep the cache alive, but it costs a run's worth of registry requests
# (about 16,800 on the warm 2026-10-18 run) and a second deletion pass.
#
# Cold start: if a package has no cache entry at all (evicted, a new package,
# or the action's cache scheme changed), the leg warns and rebuilds the cache
# with a preview-only run of the action whose delete selector matches no tag,
# so every fetched manifest is kept in the saved cache. It then restores again
# and fails loudly if there is still no entry, because that means the key or
# path below no longer matches what the action writes.
#
# Token: the rebuild runs as the org automation App (epic
# vergil-project/.github#1494, spec §5.4). On a miss the leg mints an App
# token with `permission-packages: read` and makes the rebuild's GHCR calls
# with it alone; the GHCR proof (vergil-project/.github#1516) showed the App
# reads these packages through the Packages API. There is no fallback to any
# other token: a failed mint fails the leg, and so does an empty token (the
# `App token is set` step). The App's keys live only in the `automation`
# environment (epic vergil-project/.github#1384), which the `warm` job
# declares to read them; only develop and main may deploy to it. A warm hit
# mints nothing: the restore makes no GHCR call.
#
# Coupling: the path and key below copy the action's internal cache scheme
# (src/manifest-cache.ts in ghcr-cleanup-action v1.2.2). They must stay in step
# with the action version that package-cleanup.yml uses, which is why both
# files pin the same version; docker/versions/test_package_cache_warm.py
# enforces it. On an action upgrade, re-check the scheme, then bump both.

on:
  schedule:
    - cron: "30 11 * * 3"  # Wednesdays 11:30 UTC, midway between Sunday cleanups
  workflow_dispatch:

permissions:
  # GITHUB_TOKEN only reads the repository: the rebuild's GHCR calls use the
  # App token (see the header), and it never deletes.
  contents: read

# One run at a time, so two runs never warm at once: a cold rebuild fetches
# every manifest from ghcr.io, and two runs in flight would double the legs
# past the max-parallel cap (issue #652). The group stays at run level (issue
# #1010). On a matrix job a job-level group applies to each leg, so one group
# name would cancel all but two legs of every run, and a group per package
# would no longer cap the legs of two runs together.
#
# The trade-off with failure reporting: GitHub keeps one pending run per group
# and cancels an older pending one, before any of its jobs start, `report`
# included, so that cancel is never reported. The cancelled run had done
# nothing. The newer run that replaced it runs the whole matrix, but reports
# only when it runs on develop, for the group is one for every ref: a
# dispatch from main that replaces a pending run leaves its result
# unreported, since the report action reports only from refs/heads/develop.
# A dispatch from any other branch runs no job: the `automation` environment
# refuses it.
concurrency:
  # Own group: sharing package-cleanup's group could cancel a pending cleanup.
  group: package-cache-warm
  cancel-in-progress: false

jobs:
  warm:
    name: "warm: ${{ matrix.package }}"
    runs-on: ubuntu-24.04
    # The App's keys, which the rebuild's token is minted from (see the
    # header).
    environment: automation
    strategy:
      fail-fast: false
      # Rate-limit cap (issue #652): a cold rebuild fetches every manifest.
      max-parallel: 3
      matrix:
        package:
          # Generated from docker/versions/manifest.yml by docker/versions/generate.py.
          # BEGIN generated: versions (warm)
          - dev-base
          - dev-python
          - dev-go
          - dev-rust
          - dev-cpp-clang
          - dev-cpp-gcc
          - dev-ts-node
          - dev-pkg-ubuntu
          - dev-pkg-rhel
          - prod-base
          - prod-python
          - prod-go
          - prod-rust
          - prod-cpp-clang
          - prod-cpp-gcc
          - prod-ts-node
          - prod-pkg-ubuntu
          - prod-pkg-rhel
          # END generated: versions (warm)
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - name: Restore the manifest cache
        id: touch
        uses: actions/cache/restore@v6
        with:
          # Must equal the action's cache directory and key scheme exactly:
          # the cache version is a hash of this path string.
          path: ${{ runner.temp }}/ghcr-cleanup-manifest-cache/vergil-project-${{ matrix.package }}
          key: ghcr-manifest-v1-vergil-project-${{ matrix.package }}-${{ github.run_id }}
          restore-keys: ghcr-manifest-v1-vergil-project-${{ matrix.package }}-

      - name: Report the cache state
        env:
          MATCHED_KEY: ${{ steps.touch.outputs.cache-matched-key }}
        run: |
          if [ -n "${MATCHED_KEY}" ]; then
            echo "Manifest cache for ${PACKAGE} is warm: restored ${MATCHED_KEY}, which resets its 7-day eviction clock."
          else
            echo "::warning title=Manifest cache cold::No manifest cache entry for ${PACKAGE}. Rebuilding it with a preview-only cleanup run, which fetches every manifest from ghcr.io."
          fi

      # Only on a miss, as the rebuild (see the header). No continue-on-error:
      # a failed mint fails the leg before any GHCR call.
      - name: Generate app token
        id: app-token
        if: steps.touch.outputs.cache-matched-key == ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-packages: read

      - name: App token is set
        id: app-token-set
        if: steps.touch.outputs.cache-matched-key == ''
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "${APP_TOKEN}" ]; then
            echo "::error title=No App token::The App token step minted no token; refusing to call GHCR, since no other token stands in for the App."
            exit 1
          fi

      - name: Rebuild the manifest cache (preview only)
        if: steps.touch.outputs.cache-matched-key == ''
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: vergil-project
          packages: ${{ matrix.package }}
          token: ${{ steps.app-token.outputs.token }}
          # A selector that matches no tag. A dry run still removes the digests
          # it would delete from the cache it saves, so delete-untagged here
          # would leave the untagged versions out of the rebuilt cache.
          delete-tags: vergil-cache-warm-matches-no-tag
          # Never deletes: a preview whatever package-cleanup.yml does.
          dry-run: true

      - name: Confirm the rebuilt cache
        id: verify
        if: steps.touch.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ghcr-cleanup-manifest-cache/vergil-project-${{ matrix.package }}
          key: ghcr-manifest-v1-vergil-project-${{ matrix.package }}-${{ github.run_id }}
          restore-keys: ghcr-manifest-v1-vergil-project-${{ matrix.package }}-

      - name: Fail if the cache is still cold
        if: steps.touch.outputs.cache-matched-key == '' && steps.verify.outputs.cache-matched-key == ''
        run: |
          echo "::error title=Manifest cache not found::The rebuild ran, but there is still no manifest cache entry for ${PACKAGE}. Either the rebuild's save failed (see its log) or this workflow's cache path and key no longer match the scheme of the ghcr-cleanup-action version in use (issue #700)."
          exit 1

  # Report package-cache-warm to the org's operations queue (epic
  # vergil-project/.github#1494): the ops-report action opens or comments on
  # the job's ops issue when it fails or is cancelled, and records the first
  # green run after one; it never closes an issue. It runs whatever the warm
  # legs did (always()), and reports only from refs/heads/develop, as the org
  # automation App with an issues-only token it mints, so this job's
  # GITHUB_TOKEN only reads. The App's keys live only in the `automation`
  # environment (epic vergil-project/.github#1384), which the job declares to
  # read them; only develop and main may deploy to it, so a dispatch from any
  # other branch fails this job. A composite action cannot read `vars`, so the
  # step delivers the trust layer's inputs in its env.
  # docker/versions/test_ops_reporting.py pins this layout.
  report:
    needs: [warm]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    environment: automation
    permissions:
      contents: read
    steps:
      # Setting up Vergil inside the action reads this repo's vergil.toml.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Report to the operations queue
        uses: vergil-project/vergil-actions/actions/ops/report@v2.1
        env:
          VRG_TRUSTED_AUTHORS: ${{ vars.VRG_TRUSTED_AUTHORS }}
          VRG_AUTOMATION_APP: ${{ vars.VRG_AUTOMATION_APP }}
        with:
          job: package-cache-warm
          results: ${{ needs.warm.result }}
          app-client-id: ${{ secrets.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
