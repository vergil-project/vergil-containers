# Version manifest: the single source of truth for every language version
# this repo builds (epic vergil-project/.github#407).
#
# Every other version list is generated from this file. After editing it, run
#   python3 docker/versions/generate.py
# and commit the regenerated files. CI fails if they are out of date.
#
# Families are image suffixes (dev-<key>); versions are newest first.
#
# `ga` and `eol` hold the dates the family's lifecycle adapter records
# (docker/versions/lifecycle/adapters/): `ga` is the date the version became
# eligible under the family's GA rule, and `eol` is upstream's end of support.
# A null `ga` or `eol` is intentional: upstream publishes no such date. Go and
# Rust end a release's support when a later release ships, not on a date;
# LLVM publishes no EOL; GCC closes a series without announcing a date.
schema: 1
families:
  - key: "python"
    language: "python"
    token_prefix: ""
    build_arg: "PYTHON_VERSION"
    automation: "pr"
    versions:
      - version: "3.15"
        ga: 2026-10-09
        eol: 2031-10-31
        in_policy: true
        runtime_published: true
      - version: "3.14"
        ga: 2025-10-07
        eol: 2030-10-31
        in_policy: true
        runtime_published: true
      - version: "3.13"
        ga: 2024-10-07
        eol: 2029-10-31
        in_policy: true
        runtime_published: false
      - version: "3.12"
        ga: 2023-10-02
        eol: 2028-10-31
        in_policy: true
        runtime_published: false
  - key: "java"
    language: "java"
    token_prefix: ""
    build_arg: "JDK_VERSION"
    automation: "report"
    versions:
      - version: "21"
        ga: 2023-10-10
        eol: 2029-12-31
        in_policy: true
        runtime_published: null
      - version: "17"
        ga: 2021-09-22
        eol: 2027-10-31
        in_policy: true
        runtime_published: null
  - key: "go"
    language: "go"
    token_prefix: ""
    build_arg: "GO_VERSION"
    automation: "pr"
    versions:
      - version: "1.27"
        ga: 2026-08-19
        eol: null
        in_policy: true
        runtime_published: null
      - version: "1.26"
        ga: 2026-02-10
        eol: null
        in_policy: true
        runtime_published: null
  - key: "rust"
    language: "rust"
    token_prefix: ""
    build_arg: "RUST_VERSION"
    automation: "report"
    versions:
      - version: "1.93"
        ga: 2026-01-22
        eol: null
        in_policy: true
        runtime_published: null
      - version: "1.92"
        ga: 2025-12-11
        eol: null
        in_policy: true
        runtime_published: null
  - key: "cpp-clang"
    language: "cpp"
    token_prefix: "clang-"
    build_arg: "CLANG_VERSION"
    automation: "report"
    versions:
      - version: "20"
