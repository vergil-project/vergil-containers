# Version manifest: the single source of truth for every language version
# this repo builds (epic vergil-project/.github#407).
#
# Every other version list is generated from this file. After editing it, run
#   uv run docker/versions/generate.py
# and commit the regenerated files. CI fails if they are out of date.
#
# Families are image suffixes (dev-<key>); versions are newest first.
#
# `ga` and `eol` hold the dates the family's lifecycle adapter records
# (docker/versions/lifecycle/adapters/): `ga` is the date the version became
# eligible under the family's GA rule, and `eol` is upstream's end of support.
# A null `ga` or `eol` is intentional: upstream publishes no such date. Go and
# Rust end a release's support when a later release ships, not on a date;
# LLVM publishes no EOL; GCC closes a series without announcing a date.
#
# A family may name a `parent:` (another entry's `name` and one of its
# `version`s) that its image is built FROM, and an optional top-level `base:`
# section names base's. No parent means an upstream image. The publish builds
# in tiers by depth in that tree, at most 2 deep (vergil-containers#773).
#
# The optional `toolchains:` section lists images that are not languages
# (epic vergil-project/.github#607): each has a `key`, a `build_arg` and its
# `versions`, newest first. Toolchain keys share one namespace with the
# families and `base`, so any entry may name one as its parent. Toolchains
# are built and published, but are never in window.json or the lifecycle.
#
# `core:` names the core runtimes `base` runs its own tools on (epic
# vergil-project/.github#649): the vergil-python series and the nodejs.org
# Node major. They have their own pins, separate from the family windows, and
# move only by a reviewed PR that edits this section. The core Node major is
# pinned in docker/pins/toolchains.yml.
schema: 1
core:
  python: "3.15"
  node: "22"
base:
  parent:
    name: "pkg-ubuntu"
    version: "24.04"
families:
  - key: "python"
    language: "python"
    token_prefix: ""
    build_arg: "PYTHON_VERSION"
    automation: "pr"
    parent:
      name: "base"
      version: "latest"
    versions:
      - version: "3.15"
        ga: 2026-10-09
        eol: 2031-10-31
        in_policy: true
        runtime_published: true
      - version: "3.14"
        ga: 2025-10-07
        eol: 2030-10-31
        in_policy: true
        runtime_published: true
      - version: "3.13"
        ga: 2024-10-07
        eol: 2029-10-31
        in_policy: true
        runtime_published: false
      - version: "3.12"
        ga: 2023-10-02
        eol: 2028-10-31
        in_policy: true
        runtime_published: false
  - key: "go"
    language: "go"
    token_prefix: ""
    build_arg: "GO_VERSION"
    automation: "pr"
    parent:
      name: "base"
      version: "latest"
    versions:
      - version: "1.27"
        ga: 2026-08-19
        eol: null
        in_policy: true
        runtime_published: null
      - version: "1.26"
        ga: 2026-02-10
        eol: null
        in_policy: true
        runtime_published: null
  - key: "rust"
    language: "rust"
    token_prefix: ""
    build_arg: "RUST_VERSION"
    automation: "pr"
    parent:
      name: "base"
      version: "latest"
    versions:
      - version: "1.93"
        ga: 2026-01-22
        eol: null
        in_policy: true
        runtime_published: null
      - version: "1.92"
        ga: 2025-12-11
        eol: null
        in_policy: true
        runtime_published: null
  - key: "cpp-clang"
    language: "cpp"
    token_prefix: "clang-"
    build_arg: "CLANG_VERSION"
    automation: "report"
    parent:
      name: "base"
      version: "latest"
    versions:
      - version: "20"
        ga: 2025-03-04
        eol: null
        in_policy: true
        runtime_published: null
      - version: "19"
        ga: 2024-09-17
        eol: null
        in_policy: true
        runtime_published: null
  - key: "cpp-gcc"
    language: "cpp"
    token_prefix: "gcc-"
    build_arg: "GCC_VERSION"
    automation: "report"
    parent:
      name: "base"
      version: "latest"
    versions:
      - version: "14"
        ga: 2024-05-07
        eol: null
        in_policy: true
        runtime_published: null
  - key: "ts-node"
    language: "typescript"
    token_prefix: "node-"
    build_arg: "NODE_MAJOR"
    automation: "report"
    parent:
      name: "base"
      version: "latest"
    versions:
      - version: "24"
        ga: 2025-10-28
        eol: 2028-04-30
        in_policy: true
        runtime_published: null
      - version: "22"
        ga: 2024-10-29
        eol: 2027-04-30
        in_policy: true
        runtime_published: null
toolchains:
  - key: "pkg-ubuntu"
    build_arg: "UBUNTU_VERSION"
    versions:
      - "26.04"
      - "24.04"
  - key: "pkg-rhel"
    build_arg: "RHEL_VERSION"
    versions:
      - "10"
      - "9"
