# docker/pins/pins.yml — justification for every EXACT (x.y.z) image pin.
# Floating tools need no entry. A pin here with no matching image pin, or an
# image pin with no entry here, fails CI (check_pins.py).
#
# Schema per tool:
#   constraint:       the enforced version expression
#   inducing_release: upstream release whose problem caused the pin (null if seed/unknown)
#   deterministic:    is the problem reproducible/testable? (bool)
#   reason:           prose justification
#   state:            active | under-evaluation | freed | auto-managed
#   tracking_issue:   issue ref for under-evaluation pins (else null)
#
# States:
#   active         — Tenet-6 break-hold: a specific upstream release broke us.
#   under-evaluation — held while a fix/decision is tracked (tracking_issue set).
#   freed          — no longer pinned (entry removed once the pin is gone).
#   auto-managed   — pinned in source for reproducibility, but floated to the
#                    newest upstream release by the daily upstream-refresh job
#                    (#435). inducing_release is null (not a break-hold) and the
#                    `constraint` is DESCRIPTIVE ("latest, auto-bumped daily"),
#                    never a hard-coded version — so pins.yml never drifts from
#                    the template when the bumper rewrites the ARG. The
#                    version-of-record comes from the template via extract_pins.
#
# WS2 audit (#418) outcome:
#   - Package-manager tools (npm/pip/uv/go install/cargo) that float cleanly by
#     dropping the version were FREED — their entries are gone and the install
#     lines resolve latest. See the PR for the full free/keep table.
#   - Binary release-tarball tools whose download URL requires an explicit
#     version in the path (and per-version checksum file) are KEPT here as
#     mechanism pins: they cannot float without adding an unauthenticated
#     GitHub version-resolution round-trip to every image build, which is not a
#     robust default. inducing_release stays null — these are not held because a
#     release broke us (Tenet 6), only because the install idiom needs a version.
#     FLAGGED for human decision (see PR notes). RESOLVED by #435: rather than
#     free (per-build network) or hand-manage, these 9 tools are now AUTO-MANAGED
#     — pinned in source, bumped daily by the upstream-refresh job in ops.yml.
#   - Security scanners were the silent-failure / fleet-gating set, deferred to
#     WS3-gated task #422. WS3 repoint rollback now exists (#427), lifting that
#     gate. Outcome of #422:
#       * govulncheck floats — it installs via `go install ...@latest`, so it
#         frees by dropping the version token (entry removed).
#       * trivy and scorecard are KEPT as mechanism pins — they install via
#         binary release-tarball download whose URL + per-version checksum embed
#         the version, the same class as the #418 binary tools above. Floating
#         them requires a build-time GitHub "latest" resolution on every image
#         build, deferred to the unified binary-tool build-time-expansion
#         follow-up. They are re-documented as mechanism pins below.
#       * semgrep stays intentionally floating (`uv tool install semgrep`, no
#         version) — no entry needed.
#   - REVERSED for the Rust validation tools by epic vergil-project/.github#1165
#     (spec §6.3): cargo-deny and cargo-llvm-cov, freed above as
#     `cargo install` tools, are pinned again. A validation tool decides whether
#     a Rust repo passes its gate, so an unpinned one lets an upstream release
#     change a repo's verdict between two builds of the same image source, with
#     no reviewed change to show for it. They are pinned and verified like the
#     toolchain: cargo-deny (as cargo-nextest) from its prebuilt release with
#     per-architecture digests pinned in source, cargo-llvm-cov built from
#     crates.io at its pinned version with --locked. Both are AUTO-MANAGED, so
#     the daily upstream refresh still floats them, through PRs that merge
#     themselves once CI passes (epic vergil-project/.github#1168).
pins:
  go-test-coverage:
    constraint: "==2.19.0 on Go 1.26, else latest (unpinned)"
    inducing_release: "2.20.0"
    deterministic: true
    reason: "go-test-coverage >=2.20.0 declares `go 1.27`; with GOTOOLCHAIN=local the Go 1.26 image cannot satisfy it and `go install @latest` fails the build. v2.19.0 is the last release carrying `go 1.26` (#606). Retires with Go 1.26. The earlier v2.18.3 hold for Go 1.25, and the Go 1.25-only golangci-lint hold (#569), went away when #606 retired the Go 1.25 image (follow-up vergil-project/.github#403)."
    state: active
    tracking_issue: null

  # --- Auto-managed mechanism pins (binary release tarballs) -------------------
  # The binary-download tools (the #418/#422 set) whose release-asset URL +
  # per-version checksum embed an explicit version, so they cannot float by
  # dropping a token. #435 makes them
  # AUTO-MANAGED: they stay pinned in source (hermetic,
  # reproducible, revertible) while the daily `upstream-refresh` job in `ops.yml` tracks the
  # leading edge via the /releases/latest redirect and opens a bump PR that
  # merges itself once CI passes (epic vergil-project/.github#1168).
  # inducing_release is null (not a Tenet-6 break-hold) and the constraint is
  # descriptive, not a hard-coded version — the version-of-record lives in the
  # template (extract_pins reads it). govulncheck FREED under #422 (installs via
  # `go install ...@latest`); its entry is removed. semgrep stays floating.
  shellcheck:  {constraint: "latest, auto-bumped daily", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — GitHub release tarball URL embeds the version; floated to the leading edge by the daily upstream-refresh job in ops.yml.", state: auto-managed, tracking_issue: null}
  shfmt:       {constraint: "latest, auto-bumped daily", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — GitHub release binary URL embeds the version; floated to the leading edge by the daily upstream-refresh job in ops.yml.", state: auto-managed, tracking_issue: null}
  actionlint:  {constraint: "latest, auto-bumped daily", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — GitHub release tarball + per-version checksums embed the version; the daily upstream-refresh job in ops.yml delivers the FORWARD bump #260 asked for once upstream ships it.", state: auto-managed, tracking_issue: null}
  git-cliff:   {constraint: "latest, auto-bumped daily", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — GitHub release tarball + per-version sha512 embed the version; floated to the leading edge by the daily upstream-refresh job in ops.yml.", state: auto-managed, tracking_issue: null}
  hadolint:    {constraint: "latest, auto-bumped daily", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — GitHub release binary + per-version checksums.sha256 (exact asset line) embed the version; floated to the leading edge by the daily upstream-refresh job in ops.yml.", state: auto-managed, tracking_issue: null}
  opentofu:    {constraint: "latest, auto-bumped daily", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — GitHub release tarball + per-version SHA256SUMS embed the version; floated to the leading edge by the daily upstream-refresh job in ops.yml.", state: auto-managed, tracking_issue: null}
  nfpm:        {constraint: "latest, auto-bumped daily", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — GitHub release tarball + per-version checksums embed the version; floated to the leading edge by the daily upstream-refresh job in ops.yml.", state: auto-managed, tracking_issue: null}
  scorecard:   {constraint: "latest, auto-bumped daily", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — scorecard release tarball + scorecard_checksums.txt embed the version; floated to the leading edge by the daily upstream-refresh job in ops.yml.", state: auto-managed, tracking_issue: null}
  trivy:       {constraint: "latest, auto-bumped daily", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — trivy release tarball + per-version checksums embed the version; floated to the leading edge by the daily upstream-refresh job in ops.yml (the bumps also pick up CVE-fix releases, e.g. the 0.70.0 → 0.72.0 bump under #438). The CI and publish Trivy gates run this same version, read from this pin by docker/pins/workflow_images.py (#855).", state: auto-managed, tracking_issue: null}
  # uv in the package toolchain images (pkg-ubuntu, pkg-rhel; #728) comes from
  # its release tarball, verified against the per-version .sha256, so it joins
  # the auto-managed set. The dev images still float uv (`pip install uv`).
  uv:          {constraint: "latest, auto-bumped daily", inducing_release: null, deterministic: false, reason: "auto-managed (#728) — GitHub release tarball + per-version .sha256 embed the version (package toolchain images only; the dev images float uv via pip); floated to the leading edge by the daily upstream-refresh job in ops.yml.", state: auto-managed, tracking_issue: null}
  # cargo-nextest in the rust image (#885) comes from nextest's prebuilt
  # release tarball rather than `cargo install`, so it joins the auto-managed
  # set. Its latest release is resolved through get.nexte.st, not the repo's
  # /releases/latest (see resolve_latest.py). Its per-architecture sha256 is
  # pinned in its fragment beside the version (epic vergil-project/.github
  # #1165, spec §6.3): the build verifies against the pinned digests, and the
  # refresh writes them from the release's per-asset .sha256 together with the
  # version (resolve_latest.py, TOOL_DIGESTS).
  cargo-nextest: {constraint: "latest, auto-bumped daily", inducing_release: null, deterministic: false, reason: "auto-managed (#885) — nextest's prebuilt release tarball embeds the version in its URL, and its per-architecture sha256 is pinned in source beside it (vergil-project/.github#1165) and verified at build; the daily upstream-refresh job in ops.yml floats the version and writes the digests from the release's per-asset .sha256 in the same PR (rust image only).", state: auto-managed, tracking_issue: null}
  # cargo-deny and cargo-llvm-cov in the rust image are the Rust validation
  # tools the WS2 audit (#418) had freed as `cargo install` tools; epic
  # vergil-project/.github#1165 (spec §6.3) pins them again (see the header).
  # cargo-deny comes from its prebuilt musl release tarball, verified against
  # the per-architecture sha256 pinned in its fragment, which the refresh
  # writes with the version (resolve_latest.py, TOOL_DIGESTS). cargo-llvm-cov's
  # release assets carry no checksum and no version in their names, so it is
  # built from crates.io with --locked at its pinned version; cargo verifies the
  # crate checksum against the index.
  cargo-deny:  {constraint: "latest, auto-bumped daily", inducing_release: null, deterministic: false, reason: "auto-managed (vergil-project/.github#1165) — a Rust validation tool, pinned so an upstream release cannot change a repo's gate verdict without a pinned source change (reverses the #418 free); its prebuilt musl release tarball embeds the version, and its per-architecture sha256 is pinned in source and verified at build; the daily upstream-refresh job in ops.yml floats the version and writes the digests from the release's per-asset .tar.gz.sha256 in the same PR (rust image only).", state: auto-managed, tracking_issue: null}
  cargo-llvm-cov: {constraint: "latest, auto-bumped daily", inducing_release: null, deterministic: false, reason: "auto-managed (vergil-project/.github#1165) — a Rust validation tool, pinned so an upstream release cannot change a repo's coverage verdict without a pinned source change (reverses the #418 free); built from crates.io with `cargo install --locked` at the pinned version, cargo verifying the crate checksum against the index; the daily upstream-refresh job in ops.yml floats the version (rust image only).", state: auto-managed, tracking_issue: null}
  # yq (mikefarah/yq) in base (#884) comes from its release binary, verified
  # against the release's multi-hash `checksums` file, so it joins the
  # auto-managed set. Every image built on base inherits it.
  yq:          {constraint: "latest, auto-bumped daily", inducing_release: null, deterministic: false, reason: "auto-managed (#884) — GitHub release binary + per-version checksums (SHA-256 column located through checksums_hashes_order) embed the version; floated to the leading edge by the daily upstream-refresh job in ops.yml.", state: auto-managed, tracking_issue: null}
