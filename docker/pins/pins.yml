# docker/pins/pins.yml — justification for every EXACT (x.y.z) image pin.
# Floating tools need no entry. A pin here with no matching image pin, or an
# image pin with no entry here, fails CI (check_pins.py).
#
# Schema per tool:
#   constraint:       the enforced version expression
#   inducing_release: upstream release whose problem caused the pin (null if seed/unknown)
#   deterministic:    is the problem reproducible/testable? (bool)
#   reason:           prose justification
#   state:            active | under-evaluation | freed | auto-managed
#   tracking_issue:   issue ref for under-evaluation pins (else null)
#
# States:
#   active         — Tenet-6 break-hold: a specific upstream release broke us.
#   under-evaluation — held while a fix/decision is tracked (tracking_issue set).
#   freed          — no longer pinned (entry removed once the pin is gone).
#   auto-managed   — pinned in source for reproducibility, but floated to the
#                    newest upstream release by the weekly bump-tools workflow
#                    (#435). inducing_release is null (not a break-hold) and the
#                    `constraint` is DESCRIPTIVE ("latest, auto-bumped weekly"),
#                    never a hard-coded version — so pins.yml never drifts from
#                    the template when the bumper rewrites the ARG. The
#                    version-of-record comes from the template via extract_pins.
#
# WS2 audit (#418) outcome:
#   - Package-manager tools (npm/pip/uv/go install/cargo) that float cleanly by
#     dropping the version were FREED — their entries are gone and the install
#     lines resolve latest. See the PR for the full free/keep table.
#   - Binary release-tarball tools whose download URL requires an explicit
#     version in the path (and per-version checksum file) are KEPT here as
#     mechanism pins: they cannot float without adding an unauthenticated
#     GitHub version-resolution round-trip to every image build, which is not a
#     robust default. inducing_release stays null — these are not held because a
#     release broke us (Tenet 6), only because the install idiom needs a version.
#     FLAGGED for human decision (see PR notes). RESOLVED by #435: rather than
#     free (per-build network) or hand-manage, these 9 tools are now AUTO-MANAGED
#     — pinned in source, bumped weekly by the bump-tools workflow.
#   - Security scanners were the silent-failure / fleet-gating set, deferred to
#     WS3-gated task #422. WS3 repoint rollback now exists (#427), lifting that
#     gate. Outcome of #422:
#       * govulncheck floats — it installs via `go install ...@latest`, so it
#         frees by dropping the version token (entry removed).
#       * trivy and scorecard are KEPT as mechanism pins — they install via
#         binary release-tarball download whose URL + per-version checksum embed
#         the version, the same class as the #418 binary tools above. Floating
#         them requires a build-time GitHub "latest" resolution on every image
#         build, deferred to the unified binary-tool build-time-expansion
#         follow-up. They are re-documented as mechanism pins below.
#       * semgrep stays intentionally floating (`uv tool install semgrep`, no
#         version) — no entry needed.
pins:
  go-test-coverage:
    constraint: "==2.18.3 on Go 1.25, else ==2.18.8"
    inducing_release: "2.18.4"
    deterministic: true
    reason: "go-test-coverage >=2.18.4 requires Go >=1.26; fails on the Go 1.25 image."
    state: active
    tracking_issue: null

  # --- Auto-managed mechanism pins (binary release tarballs) -------------------
  # The 9 binary-download tools (#418/#422) whose release-tarball URL + per-
  # version checksum embed an explicit version, so they cannot float by dropping
  # a token. #435 makes them AUTO-MANAGED: they stay pinned in source (hermetic,
  # reproducible, revertible) while the weekly `bump-tools` workflow tracks the
  # leading edge via the /releases/latest redirect and opens a reviewed bump PR.
  # inducing_release is null (not a Tenet-6 break-hold) and the constraint is
  # descriptive, not a hard-coded version — the version-of-record lives in the
  # template (extract_pins reads it). govulncheck FREED under #422 (installs via
  # `go install ...@latest`); its entry is removed. semgrep stays floating.
  shellcheck:  {constraint: "latest, auto-bumped weekly", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — GitHub release tarball URL embeds the version; floated to the leading edge by the weekly bump-tools workflow.", state: auto-managed, tracking_issue: null}
  shfmt:       {constraint: "latest, auto-bumped weekly", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — GitHub release binary URL embeds the version; floated to the leading edge by the weekly bump-tools workflow.", state: auto-managed, tracking_issue: null}
  actionlint:  {constraint: "latest, auto-bumped weekly", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — GitHub release tarball + per-version checksums embed the version; the weekly bump-tools workflow delivers the FORWARD bump #260 asked for once upstream ships it.", state: auto-managed, tracking_issue: null}
  git-cliff:   {constraint: "latest, auto-bumped weekly", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — GitHub release tarball + per-version sha512 embed the version; floated to the leading edge by the weekly bump-tools workflow.", state: auto-managed, tracking_issue: null}
  hadolint:    {constraint: "latest, auto-bumped weekly", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — GitHub release binary + per-version sha256 embed the version; floated to the leading edge by the weekly bump-tools workflow.", state: auto-managed, tracking_issue: null}
  opentofu:    {constraint: "latest, auto-bumped weekly", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — GitHub release tarball + per-version SHA256SUMS embed the version; floated to the leading edge by the weekly bump-tools workflow.", state: auto-managed, tracking_issue: null}
  nfpm:        {constraint: "latest, auto-bumped weekly", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — GitHub release tarball + per-version checksums embed the version; floated to the leading edge by the weekly bump-tools workflow.", state: auto-managed, tracking_issue: null}
  scorecard:   {constraint: "latest, auto-bumped weekly", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — scorecard release tarball + scorecard_checksums.txt embed the version; floated to the leading edge by the weekly bump-tools workflow.", state: auto-managed, tracking_issue: null}
  trivy:       {constraint: "latest, auto-bumped weekly", inducing_release: null, deterministic: false, reason: "auto-managed (#435) — trivy release tarball + per-version checksums embed the version; floated to the leading edge by the weekly bump-tools workflow (weekly bumps also pick up CVE-fix releases, e.g. the 0.70.0 → 0.72.0 bump under #438).", state: auto-managed, tracking_issue: null}
