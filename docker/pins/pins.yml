# docker/pins/pins.yml — justification for every EXACT (x.y.z) image pin.
# Floating tools need no entry. A pin here with no matching image pin, or an
# image pin with no entry here, fails CI (check_pins.py).
#
# Schema per tool:
#   constraint:       the enforced version expression
#   inducing_release: upstream release whose problem caused the pin (null if seed/unknown)
#   deterministic:    is the problem reproducible/testable? (bool)
#   reason:           prose justification
#   state:            active | under-evaluation | freed
#   tracking_issue:   issue ref for under-evaluation pins (else null)
#
# WS2 audit (#418) outcome:
#   - Package-manager tools (npm/pip/uv/go install/cargo) that float cleanly by
#     dropping the version were FREED — their entries are gone and the install
#     lines resolve latest. See the PR for the full free/keep table.
#   - Binary release-tarball tools whose download URL requires an explicit
#     version in the path (and per-version checksum file) are KEPT here as
#     mechanism pins: they cannot float without adding an unauthenticated
#     GitHub version-resolution round-trip to every image build, which is not a
#     robust default. inducing_release stays null — these are not held because a
#     release broke us (Tenet 6), only because the install idiom needs a version.
#     FLAGGED for human decision (see PR notes).
#   - Security scanners were the silent-failure / fleet-gating set, deferred to
#     WS3-gated task #422. WS3 repoint rollback now exists (#427), lifting that
#     gate. Outcome of #422:
#       * govulncheck floats — it installs via `go install ...@latest`, so it
#         frees by dropping the version token (entry removed).
#       * trivy and scorecard are KEPT as mechanism pins — they install via
#         binary release-tarball download whose URL + per-version checksum embed
#         the version, the same class as the #418 binary tools above. Floating
#         them requires a build-time GitHub "latest" resolution on every image
#         build, deferred to the unified binary-tool build-time-expansion
#         follow-up. They are re-documented as mechanism pins below.
#       * semgrep stays intentionally floating (`uv tool install semgrep`, no
#         version) — no entry needed.
pins:
  go-test-coverage:
    constraint: "==2.18.3 on Go 1.25, else ==2.18.8"
    inducing_release: "2.18.4"
    deterministic: true
    reason: "go-test-coverage >=2.18.4 requires Go >=1.26; fails on the Go 1.25 image."
    state: active
    tracking_issue: null

  # --- Mechanism pins (binary release tarballs; version required in URL) -------
  # Not Tenet-6 break-avoidance pins. Kept because floating would require a
  # per-build GitHub "latest" lookup (API rate-limited in CI, or a redirect
  # parse) added to every image build — a brittle default we decline to ship
  # without human sign-off. FLAGGED: #418 asks a human to decide float-vs-keep.
  shellcheck:  {constraint: "==0.11.0", inducing_release: null, deterministic: false, reason: "mechanism pin — GitHub release tarball URL embeds the version; no rate-limit-safe latest resolution. Flagged for human decision (#418).", state: active, tracking_issue: null}
  shfmt:       {constraint: "==3.13.1", inducing_release: null, deterministic: false, reason: "mechanism pin — GitHub release binary URL embeds the version; no rate-limit-safe latest resolution. Flagged for human decision (#418).", state: active, tracking_issue: null}
  actionlint:  {constraint: "==1.7.12", inducing_release: null, deterministic: false, reason: "mechanism pin — GitHub release tarball + per-version checksums URL embed the version. #260 wants a FORWARD bump once upstream client-id support lands; freeing (once the mechanism allows) would satisfy it. Flagged for human decision (#418).", state: active, tracking_issue: "vergil-project/vergil-containers#260"}
  git-cliff:   {constraint: "==2.13.1", inducing_release: null, deterministic: false, reason: "mechanism pin — GitHub release tarball + per-version sha512 URL embed the version; no rate-limit-safe latest resolution. Flagged for human decision (#418).", state: active, tracking_issue: null}
  hadolint:    {constraint: "==2.14.0", inducing_release: null, deterministic: false, reason: "mechanism pin — GitHub release binary + per-version sha256 URL embed the version; no rate-limit-safe latest resolution. Flagged for human decision (#418).", state: active, tracking_issue: null}
  opentofu:    {constraint: "==1.12.3", inducing_release: null, deterministic: false, reason: "mechanism pin — GitHub release tarball + per-version SHA256SUMS URL embed the version; no rate-limit-safe latest resolution. Flagged for human decision (#418).", state: active, tracking_issue: null}
  nfpm:        {constraint: "==2.47.0", inducing_release: null, deterministic: false, reason: "mechanism pin — GitHub release tarball + per-version checksums URL embed the version; no rate-limit-safe latest resolution. Flagged for human decision (#418).", state: active, tracking_issue: null}

  # --- Security scanners audited under #422 (WS3 rollback now exists) ----------
  # trivy + scorecard are the same binary-download mechanism-pin class as the
  # #418 tools above: their release-tarball URL and per-version checksum file
  # embed the version, so they cannot float by dropping a token. Floating them
  # requires a per-build GitHub "latest" resolution on every image build —
  # deferred to the unified binary-tool build-time-expansion follow-up (the same
  # bucket as shellcheck/shfmt/actionlint/git-cliff/hadolint/opentofu/nfpm).
  # govulncheck FREED under #422 (installs via `go install ...@latest`); its
  # entry is removed. semgrep stays floating (no entry).
  scorecard:   {constraint: "==5.5.0",  inducing_release: null, deterministic: false, reason: "mechanism pin — scorecard release tarball + scorecard_checksums.txt URL embed the version; no rate-limit-safe latest resolution. Freeing deferred to the unified binary-tool build-time-expansion follow-up (with the #418 binary tools).", state: active, tracking_issue: null}
  trivy:       {constraint: "==0.70.0", inducing_release: null, deterministic: false, reason: "mechanism pin — trivy release tarball + per-version checksums URL embed the version; no rate-limit-safe latest resolution. Freeing deferred to the unified binary-tool build-time-expansion follow-up (with the #418 binary tools).", state: active, tracking_issue: null}
